<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a2a2a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eab308"/>
      <stop offset="100%" style="stop-color:#facc15"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGrad)"/>
  
  <!-- Bitcoin Logo Circle -->
  <circle cx="100" cy="125" r="50" fill="url(#orangeGrad)"/>
  
  <!-- Bitcoin Symbol -->
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">₿</text>
  
  <!-- Mining Icon -->
  <circle cx="300" cy="80" r="25" fill="url(#yellowGrad)"/>
  <text x="300" y="90" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle">⛏</text>
  
  <!-- Hash Rate Lines -->
  <rect x="230" y="120" width="120" height="4" rx="2" fill="#4a4a4a"/>
  <rect x="240" y="135" width="100" height="4" rx="2" fill="#3a3a3a"/>
  <rect x="250" y="150" width="80" height="4" rx="2" fill="#3a3a3a"/>
  
  <!-- Title -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">SEEDVAULT</text>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Bitcoin Mining Simulator</text>
</svg>