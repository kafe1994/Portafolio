<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="blue8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0984e3"/>
      <stop offset="100%" style="stop-color:#74b9ff"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="280" fill="url(#bg8)"/>
  
  <!-- Circuit board lines -->
  <g stroke="#0984e3" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 0 90 L 60 90 L 80 110 L 150 110"/>
    <path d="M 400 130 L 320 130 L 280 90 L 200 90"/>
    <path d="M 0 190 L 50 190 L 70 170 L 120 170"/>
    <path d="M 400 70 L 340 70 L 320 90 L 250 90"/>
    <circle cx="60" cy="90" r="5" fill="#0984e3"/>
    <circle cx="320" cy="130" r="5" fill="#0984e3"/>
    <circle cx="50" cy="190" r="5" fill="#0984e3"/>
    <circle cx="340" cy="70" r="5" fill="#0984e3"/>
  </g>
  
  <!-- CPU chip -->
  <rect x="150" y="90" width="100" height="80" rx="5" fill="#2d3436" stroke="#0984e3" stroke-width="2"/>
  <rect x="165" y="105" width="70" height="50" rx="3" fill="#0d1117"/>
  <text x="200" y="135" font-family="monospace" font-size="10" fill="#0984e3" text-anchor="middle">BTC MINER</text>
  
  <!-- Pins -->
  <g fill="#636e72">
    <rect x="145" y="95" width="5" height="6"/>
    <rect x="145" y="110" width="5" height="6"/>
    <rect x="145" y="125" width="5" height="6"/>
    <rect x="145" y="140" width="5" height="6"/>
    <rect x="145" y="155" width="5" height="6"/>
    <rect x="250" y="95" width="5" height="6"/>
    <rect x="250" y="110" width="5" height="6"/>
    <rect x="250" y="125" width="5" height="6"/>
    <rect x="250" y="140" width="5" height="6"/>
    <rect x="250" y="155" width="5" height="6"/>
  </g>
  
  <!-- Bitcoin badge -->
  <circle cx="320" cy="190" r="30" fill="#f7931a"/>
  <text x="320" y="200" font-family="Arial Black" font-size="24" fill="white" text-anchor="middle">₿</text>
  
  <!-- Title -->
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0984e3" text-anchor="middle">SEEDVAULT</text>
  <text x="200" y="263" font-family="Arial" font-size="9" fill="#74b9ff" text-anchor="middle">HARDWARE MINING SIMULATION</text>
