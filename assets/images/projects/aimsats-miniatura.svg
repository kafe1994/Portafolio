<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="cyanA4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00cec9"/>
      <stop offset="100%" style="stop-color:#81ecec"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="280" fill="url(#bgA4)"/>
  
  <!-- Arcade machine -->
  <rect x="100" y="40" width="200" height="190" rx="10" fill="#2d3436" stroke="#00cec9" stroke-width="2"/>
  <rect x="120" y="60" width="160" height="100" rx="5" fill="#0d1117"/>
  
  <!-- Game on screen -->
  <rect x="130" y="70" width="80" height="80" fill="#1a1a2e"/>
  <circle cx="155" cy="100" r="10" fill="#00cec9">
    <animate attributeName="cx" values="140;180;140" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="140" y="130" width="60" height="8" rx="2" fill="#22c55e"/>
  <rect x="140" y="142" width="40" height="8" rx="2" fill="#f7931a"/>
  
  <!-- Controls -->
  <circle cx="300" y="110" r="20" fill="#636e72" stroke="#00cec9"/>
  <circle cx="300" cy="110" r="10" fill="#2d3436"/>
  
  <rect x="280" y="150" width="40" height="10" rx="3" fill="#636e72"/>
  <rect x="280" y="165" width="40" height="10" rx="3" fill="#636e72"/>
  
  <!-- Coin slot -->
  <rect x="290" y="190" width="20" height="30" rx="3" fill="#0d1117" stroke="#f1c40f"/>
  
  <!-- Score display -->
  <text x="170" y="185" font-family="monospace" font-size="14" fill="#22c55e">SATS: 12,450</text>
  
  <!-- Lightning bolt top -->
  <path d="M 200 20 L 220 20 L 210 45 L 230 45 L 185 80 L 200 50 L 180 50 Z" fill="#22c55e" filter="drop-shadow(0 0 5px #22c55e)"/>
  
  <!-- Title -->
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00cec9" text-anchor="middle">AIMSATS</text>
</svg>