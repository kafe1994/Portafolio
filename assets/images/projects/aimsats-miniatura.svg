<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGrad)"/>
  
  <!-- Lightning/Game Controller Icon -->
  <circle cx="100" cy="125" r="50" fill="url(#blueGrad)"/>
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">🎮</text>
  
  <!-- Lightning Bolt (Lightning Network) -->
  <polygon points="290,55 320,55 305,95 335,95 280,145 295,100 265,100" fill="url(#greenGrad)"/>
  
  <!-- Bitcoin Small -->
  <circle cx="340" cy="200" r="20" fill="url(#greenGrad)"/>
  <text x="340" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0a0a0a" text-anchor="middle">₿</text>
  
  <!-- Game Lines/Controller buttons -->
  <circle cx="220" cy="80" r="8" fill="#4a4a4a"/>
  <circle cx="245" cy="80" r="8" fill="#4a4a4a"/>
  <circle cx="270" cy="80" r="8" fill="#4a4a4a"/>
  
  <!-- Title -->
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">AIMSATS</text>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Play & Earn Bitcoin</text>
</svg>