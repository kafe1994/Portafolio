<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#12122a"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    
    <!-- Purple gradient for neural/tech feel -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    
    <!-- Green gradient for Lightning Network -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    
    <!-- Bitcoin orange gradient -->
    <linearGradient id="btcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a"/>
      <stop offset="100%" style="stop-color:#ffab40"/>
    </linearGradient>
    
    <!-- Cyan gradient for futuristic feel -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGrad)"/>
  
  <!-- Circuit board pattern -->
  <g stroke="#1e293b" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 0 50 L 30 50 L 40 60 L 100 60"/>
    <path d="M 0 100 L 25 100 L 35 110 L 80 110"/>
    <path d="M 0 150 L 20 150 L 30 160 L 60 160"/>
    <path d="M 400 80 L 370 80 L 360 70 L 300 70"/>
    <path d="M 400 130 L 375 130 L 365 120 L 320 120"/>
    <path d="M 400 180 L 380 180 L 370 190 L 340 190"/>
  </g>
  
  <!-- Game Controller / Neural Link Icon -->
  <g transform="translate(100, 125)" filter="url(#shadow)">
    <rect x="-50" y="-35" width="100" height="70" rx="12" fill="url(#purpleGrad)"/>
    <!-- Controller screen/face -->
    <rect x="-35" y="-20" width="70" height="40" rx="6" fill="#0f0f23"/>
    <!-- Neural network dots on controller -->
    <circle cx="-20" cy="-8" r="4" fill="url(#cyanGrad)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="url(#cyanGrad)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="-8" r="4" fill="url(#cyanGrad)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Controller buttons -->
    <circle cx="-25" cy="18" r="5" fill="#4a4a6a"/>
    <circle cx="25" cy="18" r="5" fill="#4a4a6a"/>
    <!-- D-pad -->
    <path d="M -8 -15 L -8 -25 M -13 -20 L -3 -20" stroke="#4a4a6a" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Lightning Bolt (Lightning Network) -->
  <g transform="translate(220, 125)" filter="url(#shadow)">
    <path d="M 10 -40 L 45 -40 L 30 0 L 55 0 L 0 45 L 20 0 L -5 0 Z" fill="url(#lightningGrad)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Bitcoin Badge -->
  <g transform="translate(320, 80)" filter="url(#shadow)">
    <circle r="25" fill="url(#btcGrad)"/>
    <text x="0" y="8" font-family="Arial Black, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">₿</text>
  </g>
  
  <!-- Sats Counter -->
  <g transform="translate(320, 150)">
    <rect x="-50" y="-15" width="100" height="30" rx="6" fill="rgba(22, 27, 34, 0.9)" stroke="#22c55e"/>
    <text x="0" y="5" font-family="monospace" font-size="11" fill="#22c55e" text-anchor="middle" font-weight="bold">+1,250 sats</text>
  </g>
  
  <!-- Play to Earn text -->
  <g transform="translate(200, 200)">
    <rect x="-80" y="-12" width="160" height="24" rx="4" fill="rgba(22, 27, 34, 0.8)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">PLAY TO EARN BITCOIN</text>
  </g>
  
  <!-- Title at bottom -->
  <g transform="translate(200, 232)">
    <rect x="-70" y="-15" width="140" height="30" rx="6" fill="rgba(22, 27, 34, 0.95)" stroke="#8b5cf6"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dy="0.3em">AIMSATS</text>
  </g>
  
  <!-- Animated particles -->
  <circle cx="60" cy="60" r="2" fill="#8b5cf6" opacity="0.6">
    <animate attributeName="cy" values="60;80;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="50" r="1.5" fill="#22c55e" opacity="0.5">
    <animate attributeName="cy" values="50;70;50" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="40" r="1" fill="#f7931a" opacity="0.7">
    <animate attributeName="cy" values="40;55;40" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="200" r="1.5" fill="#06b6d4" opacity="0.4">
    <animate attributeName="cy" values="200;185;200" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>